services:
  # The packaged API is used by the normal Compose workflow. In this override,
  # VS Code launches the API from the dev service instead.
  api:
    profiles: ["packaged-api"]

  dev:
    image: mcr.microsoft.com/devcontainers/dotnet:8.0-bookworm
    user: vscode
    working_dir: /workspaces/dose-registry-interview
    command: sleep infinity
    volumes:
      - .:/workspaces/dose-registry-interview:cached
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8090:8090"
    environment:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
